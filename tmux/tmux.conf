# ~/.tmux.conf
# ---------------------------------------------------------------------------
# Terminal / colors
# ---------------------------------------------------------------------------
# 256-color terminal + truecolor passthrough so nvim's termguicolors themes
# render accurately inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-ghostty:RGB"   # Ghostty's TERM doesn't match *256col*

# ---------------------------------------------------------------------------
# Prefix: C-b -> C-t  (double-tap C-t = last window)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-t
bind C-t last-window

# ---------------------------------------------------------------------------
# General behavior
# ---------------------------------------------------------------------------
set -sg escape-time 0          # no lag after pressing ESC (matters in nvim)
set -g history-limit 10000     # larger scrollback buffer
set -g focus-events on         # let nvim react to focus (autoread, etc.)
set -g mouse on                # scroll / click panes / drag to resize
setw -g mode-keys vi           # vi keybindings in copy mode

# Number windows & panes from 1; keep them renumbered after closing.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Status bar / appearance
# ---------------------------------------------------------------------------
# Theme: follows the terminal's light/dark mode (Ghostty follows macOS
# appearance). tmux 3.6+ asks the terminal which mode it's in and resolves
# the named "theme*" colours from the dark-theme-* or light-theme-* set
# below, switching live. Every style references only those names, so all
# colour lives in these two palettes. Slots are used by role, not literally:
#   themeblack = bar background   themewhite     = main text
#   themedarkgrey = raised blocks themelightgrey = muted text
#   themered = alert/prefix (orange-ish)
# Colours match Ghostty's built-in Claude Dark / Claude Light themes (nvim
# keeps its own colours on purpose). Alert = Claude's orange accent.
set -g dark-theme-black       "#262624"
set -g dark-theme-white       "#e5e4e1"
set -g dark-theme-dark-grey   "#363634"
set -g dark-theme-light-grey  "#a6a59b"
set -g dark-theme-green       "#9aca86"
set -g dark-theme-yellow      "#e8c96b"
set -g dark-theme-red         "#d97757"
set -g dark-theme-blue        "#6a9bcc"
set -g dark-theme-cyan        "#3cbe8c"
set -g dark-theme-magenta     "#9b87f5"

set -g light-theme-black      "#faf9f5"
set -g light-theme-white      "#141413"
set -g light-theme-dark-grey  "#e2e1da"
set -g light-theme-light-grey "#51504d"
set -g light-theme-green      "#2e7c4c"
set -g light-theme-yellow     "#8a6220"
set -g light-theme-red        "#a84b3a"
set -g light-theme-blue       "#184e95"
set -g light-theme-cyan       "#066049"
set -g light-theme-magenta    "#882b4d"

set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style "bg=themeblack,fg=themewhite"

set -g status-left-length 30
set -g status-left "#[bg=themegreen,fg=themeblack,bold] #{session_name} #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=themeblack#,bg=themered#,bold] PREFIX #[default] ,}#[fg=themelightgrey]#{host_short} #[fg=themedarkgrey]│ #[fg=themeyellow]%a %d %b #[fg=themedarkgrey]│ #[fg=themewhite,bold]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=themelightgrey] #I #W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[bg=themedarkgrey,fg=themeyellow,bold] #I #[fg=themewhite]#W#{?window_zoomed_flag,#[fg=themered] ,} #[default]"
setw -g window-status-activity-style "fg=thememagenta"
setw -g window-status-bell-style     "fg=themered,bold"

set -g pane-border-style        "fg=themedarkgrey"
set -g pane-active-border-style "fg=themeblue"
set -g pane-border-lines single
set -g display-panes-colour        "themelightgrey"
set -g display-panes-active-colour "themeblue"

set -g message-style         "bg=themedarkgrey,fg=themeyellow"
set -g message-command-style "bg=themedarkgrey,fg=themeblue"
setw -g mode-style           "bg=themeyellow,fg=themeblack"
setw -g clock-mode-colour    "themeblue"

# ---------------------------------------------------------------------------
# Splits (open new pane in the current pane's directory)
# ---------------------------------------------------------------------------
bind s split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Pane resizing
# ---------------------------------------------------------------------------
bind > resize-pane -R 3
bind < resize-pane -L 3
bind + resize-pane -U 3
bind - resize-pane -D 3

# ---------------------------------------------------------------------------
# Seamless navigation between nvim splits and tmux panes
# (pairs with christoomey/vim-tmux-navigator on the nvim side)
# https://github.com/christoomey/vim-tmux-navigator
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# Same movement while inside copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# C-l no longer clears the screen (taken by nav) -> restore via prefix C-l
bind C-l send-keys 'C-l'

# ---------------------------------------------------------------------------
# Copy mode (vi-style selection -> macOS system clipboard)
# ---------------------------------------------------------------------------
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Windows: prompt for a name on creation, open in current path
# ---------------------------------------------------------------------------
bind c command-prompt -p "window name:" "new-window -c '#{pane_current_path}' -n '%%'"

# ---------------------------------------------------------------------------
# Reload this config
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Save / restore sessions across reboots
# ---------------------------------------------------------------------------
# tmux-resurrect saves every session, window, split, each pane's directory
# and some running programs; prefix C-s saves, prefix C-r restores.
# tmux-continuum saves automatically every 15 minutes, so an unplanned reboot
# loses at most 15 minutes of layout. Both are pinned git submodules in
# tmux/plugins (no TPM: it installs whatever each plugin's default branch
# holds). `install.sh` checks them out.
#
# Restoring at login is done by bin/tmux-workspaces (launchd), not by
# continuum: the script restores the last save into the fresh server first,
# then creates only the ping / Life / Work windows the save lacks.
#
# Saves live outside the repo so they never get committed.
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
# Besides the defaults (nvim, vim, less, man, top, htop, ...), rerun these.
set -g @resurrect-processes "ssh ping"
set -g @continuum-save-interval "15"
set -g @continuum-restore "off"
# Load last: continuum hooks its autosave into status-right, which must be
# set before this point.
run-shell ~/dotfiles/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/dotfiles/tmux/plugins/tmux-continuum/continuum.tmux
