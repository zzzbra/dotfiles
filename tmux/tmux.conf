# ~/.tmux.conf
# ---------------------------------------------------------------------------
# Terminal / colors
# ---------------------------------------------------------------------------
# 256-color terminal + truecolor passthrough so nvim's termguicolors themes
# render accurately inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-ghostty:RGB"   # Ghostty's TERM doesn't match *256col*

# ---------------------------------------------------------------------------
# Prefix: C-b -> C-t  (double-tap C-t = last window)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-t
bind C-t last-window

# ---------------------------------------------------------------------------
# General behavior
# ---------------------------------------------------------------------------
set -sg escape-time 0          # no lag after pressing ESC (matters in nvim)
set -g history-limit 10000     # larger scrollback buffer
set -g focus-events on         # let nvim react to focus (autoread, etc.)
set -g mouse on                # scroll / click panes / drag to resize
setw -g mode-keys vi           # vi keybindings in copy mode

# Number windows & panes from 1; keep them renumbered after closing.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Status bar / appearance
# ---------------------------------------------------------------------------
# Theme: follows the terminal's light/dark mode (iTerm follows macOS
# appearance). tmux 3.6+ asks the terminal which mode it's in and resolves
# the named "theme*" colours from the dark-theme-* or light-theme-* set
# below, switching live. Every style references only those names, so all
# colour lives in these two palettes. Slots are used by role, not literally:
#   themeblack = bar background   themewhite     = main text
#   themedarkgrey = raised blocks themelightgrey = muted text
#   themered = alert/prefix (orange-ish)
# Dark = miramare (matches nvim); light = a warm paper counterpart.
set -g dark-theme-black       "#242021"
set -g dark-theme-white       "#e6d6ac"
set -g dark-theme-dark-grey   "#3c3836"
set -g dark-theme-light-grey  "#7c7266"
set -g dark-theme-green       "#87af87"
set -g dark-theme-yellow      "#d9bb80"
set -g dark-theme-red         "#e39b7b"
set -g dark-theme-blue        "#89beba"
set -g dark-theme-cyan        "#87c095"
set -g dark-theme-magenta     "#d3a0bc"

set -g light-theme-black      "#ede6d6"
set -g light-theme-white      "#3c3836"
set -g light-theme-dark-grey  "#d8ccb4"
set -g light-theme-light-grey "#8a8072"
set -g light-theme-green      "#5f875f"
set -g light-theme-yellow     "#9a6d1c"
set -g light-theme-red        "#b85c3c"
set -g light-theme-blue       "#3f7a76"
set -g light-theme-cyan       "#4e8560"
set -g light-theme-magenta    "#94587d"

set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style "bg=themeblack,fg=themewhite"

set -g status-left-length 30
set -g status-left "#[bg=themegreen,fg=themeblack,bold] #{session_name} #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=themeblack#,bg=themered#,bold] PREFIX #[default] ,}#[fg=themelightgrey]#{host_short} #[fg=themedarkgrey]│ #[fg=themeyellow]%a %d %b #[fg=themedarkgrey]│ #[fg=themewhite,bold]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=themelightgrey] #I #W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[bg=themedarkgrey,fg=themeyellow,bold] #I #[fg=themewhite]#W#{?window_zoomed_flag,#[fg=themered] ,} #[default]"
setw -g window-status-activity-style "fg=thememagenta"
setw -g window-status-bell-style     "fg=themered,bold"

set -g pane-border-style        "fg=themedarkgrey"
set -g pane-active-border-style "fg=themeblue"
set -g pane-border-lines single
set -g display-panes-colour        "themelightgrey"
set -g display-panes-active-colour "themeblue"

set -g message-style         "bg=themedarkgrey,fg=themeyellow"
set -g message-command-style "bg=themedarkgrey,fg=themeblue"
setw -g mode-style           "bg=themeyellow,fg=themeblack"
setw -g clock-mode-colour    "themeblue"

# ---------------------------------------------------------------------------
# Splits (open new pane in the current pane's directory)
# ---------------------------------------------------------------------------
bind s split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Pane resizing
# ---------------------------------------------------------------------------
bind > resize-pane -R 3
bind < resize-pane -L 3
bind + resize-pane -U 3
bind - resize-pane -D 3

# ---------------------------------------------------------------------------
# Seamless navigation between nvim splits and tmux panes
# (pairs with christoomey/vim-tmux-navigator on the nvim side)
# https://github.com/christoomey/vim-tmux-navigator
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# Same movement while inside copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# C-l no longer clears the screen (taken by nav) -> restore via prefix C-l
bind C-l send-keys 'C-l'

# ---------------------------------------------------------------------------
# Copy mode (vi-style selection -> macOS system clipboard)
# ---------------------------------------------------------------------------
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Windows: prompt for a name on creation, open in current path
# ---------------------------------------------------------------------------
bind c command-prompt -p "window name:" "new-window -c '#{pane_current_path}' -n '%%'"

# ---------------------------------------------------------------------------
# Reload this config
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
