# Symlink Mappings Configuration
# Format: source_path -> destination_path
# - source_path: Path relative to dotfiles directory
# - destination_path: Path relative to home directory (~ will be expanded)
# Lines starting with # are comments

# Shell configurations
zsh/zshrc -> ~/.zshrc
bash/bash_profile -> ~/.bash_profile

# Shell logout banners (random farewell on login-shell exit)
zsh/zlogout -> ~/.zlogout
zsh/logout -> ~/.config/shell-logout

# Editor configurations
config/nvim -> ~/.config/nvim

# Terminal multiplexer
tmux/tmux.conf -> ~/.tmux.conf

# Terminal emulator
config/ghostty -> ~/.config/ghostty

# Runtimes: mise's global versions (python, node, ruby). install.sh runs
# `mise install`; `mise use -g tool@version` writes through the link.
config/mise/config.toml -> ~/.config/mise/config.toml
# uv: use mise's Pythons rather than downloading its own.
config/uv/uv.toml -> ~/.config/uv/uv.toml

# Git configurations
git/config -> ~/.gitconfig
git/ignore -> ~/.gitignore
git/gitmessage -> ~/.gitmessage

# SSH client config (shared hosts; per-machine extras in ~/.ssh/config.local)
ssh/config -> ~/.ssh/config

# Scripts
bin/gcrb -> ~/.local/bin/gcrb
bin/python-doctor -> ~/.local/bin/python-doctor
bin/tmux-workspaces -> ~/.local/bin/tmux-workspaces
bin/tailscale -> ~/.local/bin/tailscale

# macOS LaunchAgents
launchagents/com.user.ollama-env.plist -> ~/Library/LaunchAgents/com.user.ollama-env.plist
launchagents/com.zzzbra.tmux-workspaces.plist -> ~/Library/LaunchAgents/com.zzzbra.tmux-workspaces.plist

# VS Code (macOS specific - handled separately in script)
# vscode/settings.json -> ~/Library/Application Support/Code/User/settings.json
# vscode/keybindings.json -> ~/Library/Application Support/Code/User/keybindings.json
# Claude Code — global instructions loaded in every session
claude/CLAUDE.md -> ~/.claude/CLAUDE.md
claude/settings.json -> ~/.claude/settings.json
